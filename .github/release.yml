# GitHub "automatically generated release notes" configuration.
#
# This is NOT an action, workflow, or script. It is plain config data that
# GitHub reads to build the notes our Changelog creator workflow appends to a
# release. It never creates a release or tag on its own.
#
# Effect:
#   - Merged PRs are grouped under the headings below by label.
#   - PRs carrying an excluded label (automation/bot) are left out.
#   - A "*" catch-all keeps everything else, so unlabeled work still shows.
#     The Changelog creator workflow then drops the known noisy auto PRs
#     ("Update downloads tracking snapshot ...") by title.
#   - Label names are listed in every variant the N6REJ repos actually use:
#     plain (bug, enhancement, ...) and emoji-prefixed (:bug: bug, ...), so a
#     single config works whether or not a repo has run the emoji labeler.
#   - Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - "automated"
      - "releases-update"
      - "bot :robot:"
      - ":robot: bot"
      - "Sync :arrow_forward:"
      - "released on @latest"
      - "semantic-release"
  categories:
    - title: "🚀 Features"
      labels:
        - "enhancement"
        - ":sparkles: enhancement"
        - "feature request"
        - ":bulb: feature request"
        - "accessibility"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - ":bug: bug"
    - title: "🔐 Security"
      labels:
        - "Possible security concern"
        - "Security :closed_lock_with_key:"
    - title: "📚 Documentation"
      labels:
        - "documentation"
        - ":memo: documentation"
        - "documentation :books:"
    - title: "⬆️ Dependencies"
      labels:
        - "dependencies"
        - ":game_die: dependencies"
        - "github_actions"
        - "dependencies :man_cook:"
    - title: "📦 What's Changed"
      labels:
        - "*"
